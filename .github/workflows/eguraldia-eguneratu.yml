
name: Eguraldia eguneratu

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

jobs:
  eguneratu:
    runs-on: ubuntu-latest

    steps:
      - name: Biltegia deskargatu
        uses: actions/checkout@v4

      - name: Python prestatu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cryptography instalatu
        run: python -m pip install cryptography

      - name: Euskalmet datuak sortu
        env:
          EUSKALMET_PRIVATE_KEY: ${{ secrets.EUSKALMET_PRIVATE_KEY }}
          EUSKALMET_FINGERPRINT: ${{ secrets.EUSKALMET_FINGERPRINT }}
        run: python scripts/euskalmet_datuak_sortu_BERRIA.py

      - name: Aldaketak GitHubera igo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/datuak.json data/anomaliak.json

          if git diff --cached --quiet; then
            echo "Ez dago aldaketarik."
            exit 0
          fi

          git commit -m "Euskalmet datuak eguneratu"
          git push
