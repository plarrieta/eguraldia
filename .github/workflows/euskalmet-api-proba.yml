name: Euskalmet API proba

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probatu:
    runs-on: ubuntu-latest

    steps:
      - name: Biltegia jaitsi
        uses: actions/checkout@v4

      - name: Python prestatu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cryptography instalatu
        run: python -m pip install cryptography

      - name: Euskalmet programa berria probatu
        env:
          EUSKALMET_PRIVATE_KEY: ${{ secrets.EUSKALMET_PRIVATE_KEY }}
          EUSKALMET_FINGERPRINT: ${{ secrets.EUSKALMET_FINGERPRINT }}
        run: python scripts/euskalmet_datuak_sortu_BERRIA.py

      - name: Sortutako fitxategiak aztertu
        if: success()
        run: |
          git status --short
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/datuak.json')
          if p.exists():
              data = json.loads(p.read_text(encoding='utf-8'))
              print('datuak.json sortuta; mota:', type(data).__name__)
              print('Fitxategiaren tamaina:', p.stat().st_size, 'byte')
          else:
              print('Ez da datuak.json sortu')
          PY
